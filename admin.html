<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Admin - educad</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen text-slate-700 font-sans">

  <div id="loginSection" class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-lg p-8 w-full max-w-md">
      <div class="text-center mb-6">
        <h1 class="text-2xl font-bold text-slate-800">Panel de Administración</h1>
        <p class="text-sm text-slate-500 mt-1">educad</p>
      </div>
      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-xs font-bold uppercase mb-1">Correo</label>
          <input type="email" id="email" required class="w-full px-4 py-3 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-teal-500" placeholder="tu@correo.com">
        </div>
        <div>
          <label class="block text-xs font-bold uppercase mb-1">Contraseña</label>
          <input type="password" id="password" required class="w-full px-4 py-3 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-teal-500">
        </div>
        <button type="submit" class="w-full bg-teal-500 hover:bg-teal-600 text-white font-bold py-3 rounded-xl transition">Entrar</button>
      </form>
      <p id="loginError" class="text-red-500 text-sm mt-3 text-center hidden"></p>
    </div>
  </div>

  <div id="adminSection" class="hidden">
    <header class="bg-white border-b border-slate-200 sticky top-0 z-40">
      <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
        <div>
          <h1 class="font-bold text-slate-800">Panel Admin</h1>
          <p class="text-xs text-slate-500">educad</p>
        </div>
        <button id="logoutBtn" class="text-sm text-red-500 hover:text-red-600 font-medium">
          <i class="fa-solid fa-right-from-bracket mr-1"></i> Cerrar sesión
        </button>
      </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-8 space-y-10">
      <section class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
          <div>
            <h2 class="text-xl font-bold text-slate-800">Tablón de Anuncios</h2>
            <p class="text-sm text-slate-500">Sube fotos o videos</p>
          </div>
          <label class="bg-teal-500 hover:bg-teal-600 text-white font-medium px-5 py-2.5 rounded-xl cursor-pointer transition text-sm inline-flex items-center">
            <i class="fa-solid fa-upload mr-2"></i> Subir anuncio
            <input type="file" id="anuncioInput" accept="image/*,video/*" class="hidden" multiple>
          </label>
        </div>
        <div id="anunciosList" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
          <p class="text-slate-400 text-sm col-span-full">Cargando...</p>
        </div>
      </section>

      <section class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
          <div>
            <h2 class="text-xl font-bold text-slate-800">Colegios / Logos</h2>
            <p class="text-sm text-slate-500">Logos de las instituciones aliadas</p>
          </div>
          <label class="bg-sky-500 hover:bg-sky-600 text-white font-medium px-5 py-2.5 rounded-xl cursor-pointer transition text-sm inline-flex items-center">
            <i class="fa-solid fa-upload mr-2"></i> Subir logo
            <input type="file" id="logoInput" accept="image/*" class="hidden" multiple>
          </label>
        </div>
        <div id="logosList" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
          <p class="text-slate-400 text-sm col-span-full">Cargando...</p>
        </div>
      </section>
    </main>
  </div>

  <script>
    const SUPABASE_URL = 'https://svluaavpozddahgfdvxm.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_UEYhP-cX2wrpMN97hN2C5g_yiYU_awv';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const loginSection = document.getElementById('loginSection');
    const adminSection = document.getElementById('adminSection');
    const loginForm = document.getElementById('loginForm');
    const loginError = document.getElementById('loginError');
    const logoutBtn = document.getElementById('logoutBtn');
    const anuncioInput = document.getElementById('anuncioInput');
    const logoInput = document.getElementById('logoInput');
    const anunciosList = document.getElementById('anunciosList');
    const logosList = document.getElementById('logosList');

    async function checkSession() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) { showAdmin(); loadAnuncios(); loadLogos(); }
      else showLogin();
    }

    function showLogin() {
      loginSection.classList.remove('hidden');
      adminSection.classList.add('hidden');
    }
    function showAdmin() {
      loginSection.classList.add('hidden');
      adminSection.classList.remove('hidden');
    }

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      loginError.classList.add('hidden');
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) {
        loginError.textContent = 'Correo o contraseña incorrectos';
        loginError.classList.remove('hidden');
        return;
      }
      showAdmin(); loadAnuncios(); loadLogos();
    });

    logoutBtn.addEventListener('click', async () => {
      await supabaseClient.auth.signOut();
      showLogin();
    });

    async function loadFiles(bucket, container) {
      container.innerHTML = '<p class="text-slate-400 text-sm col-span-full">Cargando...</p>';
      const { data, error } = await supabaseClient.storage.from(bucket).list('', { limit: 100, sortBy: { column: 'created_at', order: 'desc' } });
      if (error) {
        container.innerHTML = `<p class="text-red-500 text-sm col-span-full">Error: ${error.message}</p>`;
        return;
      }
      const files = (data || []).filter(f => f.name && !f.name.endsWith('/'));
      if (files.length === 0) {
        container.innerHTML = '<p class="text-slate-400 text-sm col-span-full">No hay archivos todavía</p>';
        return;
      }
      container.innerHTML = '';
      files.forEach(file => {
        const { data: urlData } = supabaseClient.storage.from(bucket).getPublicUrl(file.name);
        const url = urlData.publicUrl;
        const isVideo = /\.(mp4|webm|ogg|mov)$/i.test(file.name);
        const card = document.createElement('div');
        card.className = 'relative group bg-slate-50 rounded-xl overflow-hidden border border-slate-100';
        if (isVideo) {
          card.innerHTML = `<video src="${url}" class="w-full h-32 object-cover bg-black" muted></video><div class="p-2"><p class="text-xs text-slate-500 truncate">${file.name}</p></div><button data-bucket="${bucket}" data-name="${file.name}" class="delete-btn absolute top-2 right-2 bg-red-500 text-white w-8 h-8 rounded-full opacity-0 group-hover:opacity-100 transition flex items-center justify-center text-sm"><i class="fa-solid fa-trash"></i></button>`;
        } else {
          card.innerHTML = `<img src="${url}" alt="${file.name}" class="w-full h-32 object-contain bg-white p-2"><div class="p-2"><p class="text-xs text-slate-500 truncate">${file.name}</p></div><button data-bucket="${bucket}" data-name="${file.name}" class="delete-btn absolute top-2 right-2 bg-red-500 text-white w-8 h-8 rounded-full opacity-0 group-hover:opacity-100 transition flex items-center justify-center text-sm"><i class="fa-solid fa-trash"></i></button>`;
        }
        container.appendChild(card);
      });
      container.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          if (!confirm('¿Eliminar este archivo?')) return;
          const { error } = await supabaseClient.storage.from(btn.dataset.bucket).remove([btn.dataset.name]);
          if (error) alert('Error: ' + error.message);
          else if (btn.dataset.bucket === 'anuncios') loadAnuncios();
          else loadLogos();
        });
      });
    }

    function loadAnuncios() { loadFiles('anuncios', anunciosList); }
    function loadLogos() { loadFiles('logos', logosList); }

    async function uploadFiles(bucket, input) {
      const files = Array.from(input.files || []);
      for (const file of files) {
        const fileName = `${Date.now()}_${file.name.replace(/[^a-zA-Z0-9._-]/g, '_')}`;
        const { error } = await supabaseClient.storage.from(bucket).upload(fileName, file, { cacheControl: '3600', upsert: false });
        if (error) alert('Error al subir ' + file.name + ': ' + error.message);
      }
      input.value = '';
      if (bucket === 'anuncios') loadAnuncios();
      else loadLogos();
    }

    anuncioInput.addEventListener('change', () => uploadFiles('anuncios', anuncioInput));
    logoInput.addEventListener('change', () => uploadFiles('logos', logoInput));
    checkSession();
  </script>
</body>
</html>
